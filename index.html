<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#11152b" />
  <title>Hello, world!</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap');

    :root {
      color-scheme: dark;
      --ink: #f5f4ff;
      --muted: #aaa9c4;
      --violet: #ad91ff;
      --mint: #9df3d0;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      overflow-x: hidden;
      color: var(--ink);
      font-family: 'DM Sans', sans-serif;
      background:
        radial-gradient(ellipse at 17% 15%, #53429655 0, transparent 38%),
        radial-gradient(ellipse at 85% 82%, #206e6950 0, transparent 36%),
        #11152b;
    }

    body::before, body::after {
      position: fixed;
      z-index: -1;
      content: '';
      width: 380px;
      height: 380px;
      border: 1px solid #ffffff12;
      border-radius: 50%;
      animation: drift 16s ease-in-out infinite alternate;
    }
    body::before { top: -205px; right: 7%; box-shadow: 0 0 0 35px #ffffff08, 0 0 0 70px #ffffff05; }
    body::after { bottom: -250px; left: 5%; width: 460px; height: 460px; animation-delay: -7s; }

    .card {
      position: relative;
      width: min(100%, 720px);
      padding: clamp(34px, 8vw, 76px);
      overflow: hidden;
      text-align: center;
      border: 1px solid #ffffff20;
      border-radius: 30px;
      background: linear-gradient(145deg, #ffffff12, #ffffff06 58%, #ffffff09);
      box-shadow: 0 30px 100px #05081670, inset 0 1px #ffffff18;
      backdrop-filter: blur(18px);
      animation: rise .85s cubic-bezier(.2,.8,.2,1) both;
    }

    .site-nav {
      position: fixed;
      z-index: 2;
      top: 22px;
      left: 50%;
      display: flex;
      gap: 6px;
      padding: 6px;
      border: 1px solid #ffffff1c;
      border-radius: 999px;
      background: #11152b9c;
      backdrop-filter: blur(14px);
      transform: translateX(-50%);
    }
    .site-nav a {
      padding: 9px 15px;
      color: #aaa9c4;
      font-size: 13px;
      text-decoration: none;
      border-radius: 999px;
      transition: color .2s, background .2s;
    }
    .site-nav a:hover, .site-nav a[aria-current="page"] { color: var(--ink); background: #ffffff15; }
    .page-card { margin-top: 70px; }

    .card::before {
      position: absolute;
      top: 0;
      left: 15%;
      width: 70%;
      height: 1px;
      content: '';
      background: linear-gradient(90deg, transparent, #c7b4ffb3, transparent);
    }

    .sparkle {
      display: grid;
      width: 68px;
      height: 68px;
      margin: 0 auto 27px;
      place-items: center;
      color: #e5dcff;
      font-size: 31px;
      border: 1px solid #c6b3ff42;
      border-radius: 22px;
      background: linear-gradient(145deg, #9b78ff35, #ffffff0b);
      box-shadow: 0 10px 35px #9b78ff24, inset 0 1px #ffffff30;
      animation: glow 3s ease-in-out infinite;
    }

    .eyebrow {
      margin: 0 0 15px;
      color: var(--mint);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .22em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: 'Manrope', sans-serif;
      font-size: clamp(3rem, 10vw, 6.4rem);
      font-weight: 800;
      letter-spacing: -.075em;
      line-height: .98;
    }
    h1 span {
      color: transparent;
      background: linear-gradient(100deg, #c7b4ff 15%, #9df3d0 92%);
      background-clip: text;
      -webkit-background-clip: text;
    }

    .message {
      max-width: 430px;
      margin: 24px auto 0;
      color: var(--muted);
      font-size: clamp(15px, 2.3vw, 17px);
      line-height: 1.75;
    }

    .rule {
      width: 44px;
      height: 1px;
      margin: 34px auto 20px;
      background: linear-gradient(90deg, transparent, #ffffff70, transparent);
    }

    .footer {
      color: #85849f;
      font-size: 12px;
      letter-spacing: .04em;
    }
    .footer b { color: #c8c5dc; font-weight: 500; }

    @keyframes rise { from { opacity: 0; transform: translateY(18px) scale(.985); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes glow { 50% { box-shadow: 0 10px 42px #9b78ff48, inset 0 1px #ffffff30; transform: translateY(-3px); } }
    @keyframes drift { to { transform: translate(24px, 18px) rotate(15deg); } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <nav class="site-nav" aria-label="Main navigation">
    <a href="index.html" aria-current="page">Home</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </nav>
  <main class="card page-card">
    <div class="sparkle" aria-hidden="true">✦</div>
    <p class="eyebrow">A little something to start</p>
    <h1>Hello,<br /><span>world!</span></h1>
    <p class="message">A fresh page, a bright idea, and a whole world of possibilities. Here’s to whatever you make next.</p>
    <div class="rule" aria-hidden="true"></div>
    <div class="footer">Made with <b>curiosity</b> &amp; a little bit of sparkle</div>
  </main>
</body>
</html>
